name: deploy

on:
  push:
    branches: [main]
  # El contenido real (catálogo, roadmap) viene de un release de
  # davidcasr/colombia-open, no de un push a este repo — por eso el build
  # se repite a diario, aunque este repo no haya cambiado, para no quedar
  # desactualizado. Ver .claude/rules/data-source.md.
  schedule:
    - cron: "17 10 * * *" # ~05:17 America/Bogota (UTC-5)
  # Permite que davidcasr/colombia-open dispare un rebuild inmediato al
  # publicar un release nuevo (requiere wiring en ese repo — ver
  # .claude/rules/data-source.md). Hasta entonces, el cron diario es el
  # mecanismo real de actualización.
  repository_dispatch:
    types: [library-release]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build (falla si no puede leer el catálogo publicado)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "out"
      - id: deployment
        uses: actions/deploy-pages@v5
